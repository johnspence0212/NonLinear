<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>nonlinear</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <a class="brand" href="#/">nonlinear</a>
        <span id="status" class="muted"></span>
      </header>
      <div class="shell">
        <nav>
          <button data-filter="open">open</button>
          <button data-filter="frontier">frontier</button>
          <button data-filter="maps">maps</button>
          <button data-filter="closed">closed</button>
          <button data-filter="all">all</button>
        </nav>
        <main id="main"></main>
      </div>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
